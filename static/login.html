<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - CFGuard</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/static/utilities.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-linear-to-br from-blue-600 to-purple-700">
    <main class="bg-white rounded-2xl p-8 w-full max-w-md shadow-lg">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">CFGuard</h1>
            <p class="text-gray-600">DNS 故障切换管理系统</p>
        </div>
        <form id="login-form" class="space-y-6">
            <div>
                <label for="token" class="block text-sm font-medium text-gray-700 mb-2">登录密码</label>
                <input type="password" id="token" name="token" required autocomplete="current-password"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                    placeholder="输入配置文件中的登录密码">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50">登录</button>
        </form>
        <p id="error-message" role="alert" class="hidden mt-4 p-3 bg-red-50 text-red-700 rounded-lg"></p>
        <p class="mt-6 text-center text-sm text-gray-500">登录有效期为 24 小时</p>
        <a class="block mt-3 text-center text-sm text-blue-600" href="https://github.com/sck03/cloudflare-dns-failover">部署与配置说明</a>
    </main>
    <script type="module" src="/static/js/login.js"></script>
</body>
</html>
