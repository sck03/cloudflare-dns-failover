server:
  # 服务监听端口 (默认 8099)
  port: 8099
  # 调试模式 (生产环境建议 false)
  debug: false
  # 是否开启登录认证 (建议开启，内网环境可关闭)
  auth_enabled: true
  # JWT 密钥，用于登录会话加密
  # 【重要】这也是 Web 管理界面的登录密码！生产环境请务必修改。
  jwt_secret: "change-this-secret-key-in-production"

database:
  # 数据库文件路径
  path: "instance/cfguard.db"

accounts:
  - name: "default"
    # 推荐使用 API Token (权限控制更细)
    # 获取地址: https://dash.cloudflare.com/profile/api-tokens
    api_token: "YOUR_CLOUDFLARE_API_TOKEN"
    # 或者使用 Email + Global API Key (旧版方式，不推荐)
    email: ""
    api_key: ""

notification:
  dingtalk:
    enabled: false
    access_token: ""
    # 可选：安全设置中的加签密钥
    secret: ""
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  email:
    enabled: false
    host: "smtp.example.com"
    # 端口: 465 (SSL/TLS) 或 587 (STARTTLS)
    port: 465
    username: "your_email@example.com"
    password: "your_email_password"
    to: "admin@example.com"

# 注意：此列表仅用于在程序首次启动时，将配置“同步”到数据库。
# 在那之后，所有的监控项管理（增、删、改）都应在 Web UI 中进行。
# 为避免重启后 UI 上的删除操作被覆盖（“复活”问题），建议将此列表保持为空。
# 如果你确实需要通过配置文件预设监控，可以取消下面行的注释并添加你的配置。
monitors: []
