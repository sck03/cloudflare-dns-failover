services:
  cfguard:
    image: ghcr.io/sck03/cloudflare-dns-failover:latest
    container_name: cfguard
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8099:8099"
    volumes:
      - ./config:/app/config
      - ./instance:/app/instance
    environment:
      TZ: Asia/Shanghai
    cap_add:
      - NET_RAW
