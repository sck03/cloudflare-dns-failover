server:
  # 服务监听端口 (默认 8099)
  port: 8099
  # 调试模式 (生产环境建议 false)
  debug: false
  # 同时执行的监控操作上限，每项最多并行探测两个源站
  max_concurrent_checks: 8
  # 是否开启登录认证 (建议开启，内网环境可关闭)
  auth_enabled: true
  # JWT 签名密钥，同时也是 Web 登录密码；至少 32 字符，必须替换示例值
  jwt_secret: "change-this-secret-key-in-production"

database:
  # 数据库文件路径
  path: "instance/cfguard.db"
  # 切换事件保留天数，启动时和每小时清理
  history_retention_days: 30

accounts:
  - name: "default"
    # 推荐使用 API Token (权限控制更细)
    # 获取地址: https://dash.cloudflare.com/profile/api-tokens
    api_token: "YOUR_CLOUDFLARE_API_TOKEN"
    # 或者使用 Email + Global API Key (旧版方式，不推荐)
    email: ""
    api_key: ""

notification:
  dingtalk:
    enabled: false
    access_token: ""
    # 可选：安全设置中的加签密钥
    secret: ""
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  email:
    enabled: false
    host: "smtp.example.com"
    # 端口: 465 (SSL/TLS) 或 587 (STARTTLS)
    port: 465
    username: "your_email@example.com"
    password: "your_email_password"
    to: "admin@example.com"

# 只在新数据库首次初始化时导入；以后由 Web UI / API 管理。
# 初始化标记保存在数据库，重启不会覆盖修改或重新导入已删除的策略。
